name: tests-and-evals
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-msmarco-v1
      - name: Install
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Unit + API tests (sample fixture, embedded Qdrant)
        run: pytest -q
      - name: Retrieval eval on the sample index (fails on quality regressions)
        run: python scripts/ci_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/ci/
